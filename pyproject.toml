[tool.poetry]
name = "agentic-chatbot"
version = "0.0.1"
description = ""
readme = "README.md"
authors = ["Pietro Foini <pietro.foini1@gmail.com>"]
packages = [{ include = "chatbot" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0.0"
uvicorn = "0.52.4"
fastapi = "0.141.1"
python-multipart = "0.0.32"
pydantic = "2.13.5"
pydantic-settings = "2.15.0"
langchain-core = "1.6.5"
langchain-text-splitters = "1.1.2"
langchain-ollama = "1.1.0"
langchain-google-genai = "4.4.0"
langchain-postgres = "0.0.18"
langchain = "1.4.2"
langgraph = "1.2.12"
langgraph-checkpoint = "4.2.0"
langgraph-checkpoint-postgres = "3.1.2"
psycopg2-binary = "2.9.13"
more-itertools = "11.1.0"
google-genai = "2.25.0"
google-cloud-storage = "3.15.0"
tiktoken = "0.14.0"

[tool.poetry.group.dev.dependencies]
isort = "9.0.2"
black = "26.5.1"
mypy = "2.3.1"
pre-commit = "4.6.2"
pydocstyle = "6.3.0"
notebook = "7.6.0"

[tool.poetry.group.test.dependencies]
pytest-mock = "3.16.0"
mock = "5.2.0"
pytest = "9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
exclude = '''
/(\n  \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | _build\n  | buck-out\n  | build\n  | dist\n  | dockerfile\n  | \.md\n  | \.txt\n  | \.gitignore\n  | \.lock\n)/\n
'''

[tool.isort]
skip_glob = ["tests/*"]
profile = "black"
line_length = 120
