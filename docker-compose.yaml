services:
  postgres_db:
    image: pgvector/pgvector:pg15
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-chatbot}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: "gcp"
    container_name: chatbot_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
    - ${ENV_FILE:-.env}
    environment:
      - DB_HOST=postgres_db
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/application_default_credentials.json
    volumes:
      - ./.secrets/application_default_credentials.json:/secrets/application_default_credentials.json:ro
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data: