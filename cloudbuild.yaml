steps:
# Build the container image.
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-container-image'
  entrypoint: bash
  args:
    - -c
    - |
      docker build -t $_REGION-docker.pkg.dev/$_PROJECT_ID/servers/$REPO_NAME-server:latest \
      --network=cloudbuild \
      .
# Push the container image to Artifact Registry.
- name: 'gcr.io/cloud-builders/docker'
  id: 'push-container-image'
  entrypoint: bash
  args:
    - -c
    - |
      docker push $_REGION-docker.pkg.dev/$_PROJECT_ID/servers/$REPO_NAME-server:latest
# Deploy container image to Cloud Run.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-cloud-run'
  entrypoint: bash
  args:
    - -c
    - |
      gcloud run deploy agentic-chatbot \
          --image $_REGION-docker.pkg.dev/$_PROJECT_ID/servers/$REPO_NAME-server:latest \
          --region $_REGION \
          --memory 4096Mi \
          --cpu 2 \
          --timeout 800 \
          --cpu-throttling \
          --min-instances=0 \
          --max-instances=100 \
          --project $_PROJECT_ID \
          --service-account $_SERVICE_ACCOUNT \
          --add-cloudsql-instances $_PROJECT_ID:$_REGION:$_INSTANCE_NAME \
          --set-env-vars PROJECT_ID=$_PROJECT_ID \
          --set-env-vars GCS_PROCESSED_BUCKET=$_GCS_PROCESSED_BUCKET \
          --set-env-vars COOKIE_SECURE=$_COOKIE_SECURE \
          --set-env-vars DB_NAME=$_DB_NAME \
          --set-env-vars DB_HOST=$_DB_HOST \
          --set-env-vars DB_PORT=$_DB_PORT \
          --set-secrets="DB_USER=postgres_db_username:latest" \
          --set-secrets="DB_PASSWORD=postgres_db_password:latest" \
          --set-secrets="SECRET_KEY=secret_key:latest" \
          --allow-unauthenticated \
          --labels team=ml \
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/$_SERVICE_ACCOUNT'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
