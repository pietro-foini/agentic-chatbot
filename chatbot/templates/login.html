<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sign In - Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        pine: {
                            400: '#2F9E72',
                            500: '#19875e',
                            600: '#0E6E4E',
                            700: '#0B5940',
                        },
                        ink: '#111315',
                    },
                },
            },
        }
    </script>
</head>
<body class="font-sans bg-white dark:bg-ink text-neutral-900 dark:text-neutral-100 flex min-h-screen items-center justify-center p-4 antialiased">
    <div class="w-full max-w-sm">
        <div class="mb-8 flex flex-col items-center text-center">
            <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-pine-600/10 text-pine-600 dark:bg-pine-400/15 dark:text-pine-400">
                <i data-lucide="bot" class="h-6 w-6"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Welcome back</h1>
            <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">Sign in to your account to continue</p>
        </div>

        <div class="rounded-2xl border border-neutral-200/80 bg-neutral-50 p-6 shadow-sm dark:border-neutral-800/80 dark:bg-neutral-900/90">
            {% if error %}
            <div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-3 text-xs text-red-600 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-400">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="username" class="px-1 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 dark:text-neutral-500">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-xs text-neutral-900 outline-none transition-all placeholder:text-neutral-400 focus:border-pine-600 focus:ring-2 focus:ring-pine-600/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100 dark:placeholder:text-neutral-500 dark:focus:border-pine-400 dark:focus:ring-pine-400/20"
                    />
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="px-1 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 dark:text-neutral-500">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-xs text-neutral-900 outline-none transition-all placeholder:text-neutral-400 focus:border-pine-600 focus:ring-2 focus:ring-pine-600/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100 dark:placeholder:text-neutral-500 dark:focus:border-pine-400 dark:focus:ring-pine-400/20"
                    />
                </div>

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-xl bg-pine-600 py-2.5 text-xs font-semibold text-white shadow-sm shadow-pine-600/20 transition-all hover:bg-pine-700 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-pine-600"
                >
                    <span>Sign in</span>
                    <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i>
                </button>
            </form>
        </div>

        <p class="mt-4 text-center text-xs text-neutral-500 dark:text-neutral-400">
            Don't have an account?
            <a href="/register" class="font-semibold text-pine-600 hover:text-pine-700 hover:underline dark:text-pine-400 dark:hover:text-pine-300">
                Register
            </a>
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
