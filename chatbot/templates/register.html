<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    colors: {
                        pine: { 400: '#2F9E72', 500: '#19875e', 600: '#0E6E4E', 700: '#0B5940' },
                        ink: '#111315',
                    },
                },
            },
        }
    </script>
</head>
<body class="font-sans bg-white dark:bg-ink text-neutral-900 dark:text-neutral-100 flex min-h-screen items-center justify-center p-4 antialiased">
    <div class="w-full max-w-sm">
        <div class="mb-8 flex flex-col items-center text-center">
            <h1 class="text-xl font-bold tracking-tight">Create an account</h1>
            <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">Sign up to get started</p>
        </div>

        <div class="rounded-2xl border border-neutral-200/80 bg-neutral-50 p-6 shadow-sm dark:border-neutral-800/80 dark:bg-neutral-900/90">
            {% if error %}
            <div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-3 text-xs text-red-600 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-400">
                {{ error }}
            </div>
            {% endif %}

            <form action="/register" method="POST" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="username" class="px-1 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 dark:text-neutral-500">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-xs text-neutral-900 outline-none transition-all placeholder:text-neutral-400 focus:border-pine-600 focus:ring-2 focus:ring-pine-600/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100 dark:focus:border-pine-400" />
                </div>

                <div class="space-y-1.5">
                    <label for="email" class="px-1 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 dark:text-neutral-500">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                           class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-xs text-neutral-900 outline-none transition-all placeholder:text-neutral-400 focus:border-pine-600 focus:ring-2 focus:ring-pine-600/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100 dark:focus:border-pine-400" />
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="px-1 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 dark:text-neutral-500">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                           class="w-full rounded-xl border border-neutral-200 bg-white px-3 py-2 text-xs text-neutral-900 outline-none transition-all placeholder:text-neutral-400 focus:border-pine-600 focus:ring-2 focus:ring-pine-600/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100 dark:focus:border-pine-400" />
                </div>

                <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-pine-600 py-2.5 text-xs font-semibold text-white shadow-sm transition-all hover:bg-pine-700 active:scale-[0.98]">
                    <span>Register</span>
                </button>
            </form>
        </div>

        <p class="mt-4 text-center text-xs text-neutral-500">
            Do you already have an account? <a href="/login" class="font-semibold text-pine-600 dark:text-pine-400 hover:underline">Sign In</a>
        </p>
    </div>
</body>
</html>
