<div id="approval-box-{{ thread_id }}" class="w-full max-w-4xl mx-auto p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl my-2">
    <div class="flex items-center gap-2 text-amber-700 dark:text-amber-400 font-semibold text-xs mb-2">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        <span>Action Approval Required</span>
    </div>
    <div class="text-xs font-mono bg-white dark:bg-neutral-900 p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-800 text-neutral-700 dark:text-neutral-300 mb-3 whitespace-pre-wrap">
        {{ approval_info }}
    </div>

    <div class="flex gap-2">
        <button
            hx-post="/chat/{{ thread_id }}"
            hx-vals='{"approved": "true"}'
            hx-target="#approval-box-{{ thread_id }}"
            hx-swap="outerHTML"
            class="bg-pine-600 hover:bg-pine-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all"
        >
            Approve
        </button>
        <button
            hx-post="/chat/{{ thread_id }}"
            hx-vals='{"approved": "false", "reason": "Action rejected by user."}'
            hx-target="#approval-box-{{ thread_id }}"
            hx-swap="outerHTML"
            class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all"
        >
            Reject
        </button>
    </div>
</div>
