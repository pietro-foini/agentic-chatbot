<article class="w-full max-w-4xl mx-auto flex items-start justify-start gap-3 animate-fade-in" id="approval-card-{{ thread_id }}">
    <div class="group/avatar relative shrink-0">
        <div class="w-8 h-8 rounded-full bg-amber-500/15 text-amber-600 dark:bg-amber-400/15 dark:text-amber-400 flex items-center justify-center cursor-default">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M12 8v4"/>
                <path d="M12 16h.01"/>
            </svg>
        </div>
        <span class="pointer-events-none absolute bottom-full mb-1.5 left-0 whitespace-nowrap rounded-md bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 text-[11px] font-medium px-2 py-0.5 opacity-0 group-hover/avatar:opacity-100 transition-opacity z-20 shadow">
            Guardrail
        </span>
    </div>

    <div class="flex flex-col items-start min-w-0 max-w-[min(85%,36rem)] bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl rounded-tl-sm p-4 shadow-sm">

        <div class="flex items-center justify-between w-full mb-2 gap-3">
            <span class="text-xs font-semibold tracking-wide uppercase text-neutral-500 dark:text-neutral-400">
                Action Authorization Required
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/10 text-amber-700 dark:text-amber-400 border border-amber-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                Pending
            </span>
        </div>

        <p class="text-sm leading-relaxed text-neutral-700 dark:text-neutral-300 mb-4 whitespace-pre-wrap break-words">
            {{ approval_info.message or "The assistant requires your permission to perform this sensitive action." }}
        </p>

        <div class="flex items-center justify-between w-full pt-2 border-t border-neutral-100 dark:border-neutral-800/80">
            <div class="flex items-center gap-2">
                <button
                    type="button"
                    hx-post="/chat/{{ thread_id }}/resume"
                    hx-vals='{"approved": "true"}'
                    hx-target="#approval-card-{{ thread_id }}"
                    hx-swap="outerHTML"
                    hx-indicator="#spinner-{{ thread_id }}"
                    class="inline-flex items-center gap-1.5 bg-pine-600 hover:bg-pine-700 text-white text-xs font-medium py-1.5 px-3.5 rounded-xl transition-all shadow-sm active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-pine-600">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5">
                        <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" clip-rule="evenodd" />
                    </svg>
                    <span>Approve</span>
                </button>

                <button
                    type="button"
                    hx-post="/chat/{{ thread_id }}/resume"
                    hx-vals='{"approved": "false", "reason": "Operation canceled by user."}'
                    hx-target="#approval-card-{{ thread_id }}"
                    hx-swap="outerHTML"
                    hx-indicator="#spinner-{{ thread_id }}"
                    class="inline-flex items-center gap-1.5 text-xs font-medium py-1.5 px-3 rounded-xl text-neutral-500 hover:text-red-600 dark:text-neutral-400 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all active:scale-95 focus-visible:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5">
                        <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
                    </svg>
                    <span>Decline</span>
                </button>
            </div>

            <div id="spinner-{{ thread_id }}" class="htmx-indicator text-xs text-neutral-400 dark:text-neutral-500 flex items-center gap-1.5">
                <svg class="animate-spin w-3.5 h-3.5 text-pine-600 dark:text-pine-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                <span>Resuming...</span>
            </div>
        </div>

    </div>
</article>
