<article class="w-full max-w-4xl mx-auto flex items-start justify-end gap-3">
    <div class="group flex flex-col items-end min-w-0 max-w-[min(80%,36rem)]">
        {% if user_message.attachment %}
        <div class="mb-1.5 flex items-center gap-2 bg-pine-700 text-white text-xs px-3 py-1.5 rounded-xl">
            <i data-lucide="paperclip" class="w-4 h-4 shrink-0"></i>
            <span class="truncate font-medium">{{ user_message.attachment.id }}</span>
        </div>
        {% endif %}

        {% if user_message.content %}
        <div class="rounded-2xl rounded-br-sm px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap break-words bg-pine-600 text-white">{{ user_message.content }}</div>
        {% endif %}

        <button type="button" onclick="copyMessage(this)" aria-label="Copy message" class="copy-btn mt-1.5 inline-flex items-center gap-1 text-xs text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-300 opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 focus-visible:opacity-100 transition-opacity focus-visible:outline-none">
            <i data-lucide="copy" class="icon-copy w-3.5 h-3.5"></i>
            <i data-lucide="check" class="icon-check w-3.5 h-3.5 hidden"></i>
            <span class="label">Copy</span>
        </button>
    </div>

    <div class="group/avatar relative shrink-0">
        <div class="w-8 h-8 rounded-full bg-pine-600/20 text-pine-600 dark:bg-pine-400/20 dark:text-pine-400 flex items-center justify-center cursor-default">
            <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <span class="pointer-events-none absolute bottom-full mb-1.5 right-0 whitespace-nowrap rounded-md bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 text-[11px] font-medium px-2 py-0.5 opacity-0 group-hover/avatar:opacity-100 transition-opacity z-20 shadow">
            {{ user_message.name if user_message.name else 'User' }}
        </span>
    </div>
</article>

<form hx-post="/chat/{{ thread_id }}/assistant" hx-trigger="load" hx-swap="outerHTML" hx-include="#model-select" class="w-full max-w-4xl mx-auto flex items-start justify-start gap-3 mt-5">
    <input type="hidden" name="user_message_json" value='{{ user_message.model_dump_json() }}'>

    <div class="group/avatar relative shrink-0">
        <div class="w-8 h-8 rounded-full bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-neutral-400 cursor-default">
            <i data-lucide="bot" class="w-4 h-4 animate-pulse"></i>
        </div>
        <span class="pointer-events-none absolute bottom-full mb-1.5 left-0 whitespace-nowrap rounded-md bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 text-[11px] font-medium px-2 py-0.5 opacity-0 group-hover/avatar:opacity-100 transition-opacity z-20 shadow">
            Assistant
        </span>
    </div>

    <div class="group flex flex-col items-start min-w-0">
        <div class="rounded-2xl rounded-bl-sm px-4 py-3 bg-neutral-100 dark:bg-neutral-800 flex items-center gap-1.5 h-10">
            <span class="w-1.5 h-1.5 bg-neutral-400 rounded-full animate-bounce"></span>
            <span class="w-1.5 h-1.5 bg-neutral-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></span>
            <span class="w-1.5 h-1.5 bg-neutral-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></span>
        </div>
    </div>
</form>
