<article class="w-full max-w-4xl mx-auto flex items-start justify-start gap-2.5 htmx-added">
    <div class="group/avatar relative shrink-0">
        <div class="w-7 h-7 rounded-full bg-red-100 dark:bg-red-900/50 flex items-center justify-center text-red-600 dark:text-red-400 cursor-default">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
    </div>

    <div class="group flex flex-col items-start min-w-0 max-w-[min(80%,32rem)]">
        <div class="rounded-xl rounded-bl-sm px-3.5 py-2 text-[13px] leading-relaxed whitespace-pre-wrap break-words bg-red-50 text-red-700 dark:bg-red-950/30 dark:text-red-400 border border-red-200/60 dark:border-red-900/40 shadow-sm">
            <strong>Something went wrong.</strong>
            {{ error | default("A system error occurred while processing your request. Please try again in a moment.", true) }}
        </div>
    </div>
</article>
