<article class="w-full max-w-4xl mx-auto flex items-start justify-start gap-3">
    <div class="group/avatar relative shrink-0">
        <div class="w-8 h-8 rounded-full bg-rose-500/10 text-rose-500 dark:bg-rose-500/20 dark:text-rose-400 flex items-center justify-center ring-2 ring-white dark:ring-ink">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
        </div>
        <span class="pointer-events-none absolute bottom-full mb-1.5 left-0 whitespace-nowrap rounded-md bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 text-[11px] font-medium px-2 py-0.5 hidden group-hover/avatar:block z-20 shadow">
            System
        </span>
    </div>

    <div class="flex flex-col items-start min-w-0 max-w-[min(88%,44rem)] w-fit">
        <div class="rounded-2xl rounded-bl-sm px-4 py-2.5 text-xs sm:text-sm leading-relaxed bg-neutral-100 dark:bg-neutral-800/90 border border-rose-500/25 text-neutral-800 dark:text-neutral-200 shadow-sm">
            <div class="flex items-center gap-1.5 font-semibold text-rose-600 dark:text-rose-400 text-xs mb-1">
                <i data-lucide="triangle-alert" class="w-3.5 h-3.5"></i>
                <span>Unable to complete request</span>
            </div>
            <p class="whitespace-pre-wrap break-words text-neutral-600 dark:text-neutral-300 font-mono text-xs">
                {{ error }}
            </p>
        </div>
    </div>
</article>
